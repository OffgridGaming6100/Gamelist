<!-- MODAL FOR SYSTEM REQUIREMENTS -->
    <div class="modal-container" id="reqsModal">
        <div class="modal-header">
            <div class="modal-title" id="modalGameTitle"><i class="fa-solid fa-microchip"></i> System Requirements</div>
            <button class="btn-close-modal" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="reqs-grid" id="modalReqsGrid">
            <!-- Dynamic Reqs Injected Here -->
        </div>
    </div>

    <!-- CART / SELECTION DRAWER -->
    <div class="cart-widget" id="cartWidget">
        <div class="cart-header">
            <span><i class="fa-solid fa-gamepad"></i> Selected Games (<span id="cartCount">0</span>)</span>
            <div class="cart-header-actions">
                <button class="btn-clear-all" id="btnClearAll">Clear All</button>
            </div>
        </div>
        <ul class="cart-items" id="cartItems">
            <li class="empty-msg">No games selected yet.</li>
        </ul>
        <div class="hdd-storage-section">
            <div class="hdd-label-row">
                <div class="hdd-info-group">
                    <i class="fa-solid fa-hard-drive hdd-icon"></i>
                    <span>Storage Used: <span class="hdd-val-highlight" id="totalSize">0.00 GB</span></span>
                </div>
            </div>
        </div>
        <div class="cart-footer">
            <button class="btn-copy-drawer" id="btnCopy" disabled>
                <i class="fa-solid fa-copy"></i> Copy Selected List
            </button>
        </div>
    </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State
            let currentRam = 8;
            let currentVram = 4;
            let activeGenre = 'all';
            let searchQuery = '';
            let selectedGames = new Map();

            // DOM Elements
            const gameCards = document.querySelectorAll('.game-card');
            const searchInput = document.getElementById('searchInput');
            const sortSelect = document.getElementById('sortSelect');
            const genreChips = document.getElementById('genreChips');
            const rigPresets = document.getElementById('rigPresets');
            const cartItems = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const totalSizeEl = document.getElementById('totalSize');
            const btnClearAll = document.getElementById('btnClearAll');
            const btnCopy = document.getElementById('btnCopy');
            const reqsModal = document.getElementById('reqsModal');
            const btnCloseModal = document.getElementById('btnCloseModal');
            const modalGameTitle = document.getElementById('modalGameTitle');
            const modalReqsGrid = document.getElementById('modalReqsGrid');

            // 1. Rig Analyzer & Performance Calculations
            function updatePerformance() {
                gameCards.forEach(card => {
                    const reqRam = parseFloat(card.dataset.ram) || 0;
                    const reqVram = parseFloat(card.dataset.vram) || 0;
                    const id = card.dataset.id;

                    const hud = document.getElementById(`hud-${id}`);
                    const fps = document.getElementById(`fps-${id}`);
                    const tweak = document.getElementById(`tweak-${id}`);

                    if (currentRam >= reqRam && currentVram >= reqVram) {
                        if (hud) {
                            hud.className = 'hud-status-badge status-ready';
                            hud.innerHTML = '<i class="fa-solid fa-check"></i> READY TO PLAY';
                        }
                        if (fps) fps.innerHTML = '<i class="fa-solid fa-gauge-high"></i> 60+ FPS';
                        if (tweak) tweak.innerHTML = '<i class="fa-solid fa-sliders"></i> High / Ultra Settings';
                    } else if (currentRam >= reqRam || currentVram >= reqVram) {
                        if (hud) {
                            hud.className = 'hud-status-badge status-vram';
                            hud.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> TWEAKS NEEDED';
                        }
                        if (fps) fps.innerHTML = '<i class="fa-solid fa-gauge-high"></i> 30-45 FPS';
                        if (tweak) tweak.innerHTML = '<i class="fa-solid fa-sliders"></i> Lower Anti-Aliasing / Textures';
                    } else {
                        if (hud) {
                            hud.className = 'hud-status-badge status-warning';
                            hud.innerHTML = '<i class="fa-solid fa-xmark"></i> LOW PERFORMANCE';
                        }
                        if (fps) fps.innerHTML = '<i class="fa-solid fa-gauge-high"></i> <30 FPS';
                        if (tweak) tweak.innerHTML = '<i class="fa-solid fa-sliders"></i> Low Settings & 720p Resolution';
                    }
                });
            }

            // Preset Button Clicks
            rigPresets.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-preset');
                if (!btn) return;
                rigPresets.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRam = parseFloat(btn.dataset.ram);
                currentVram = parseFloat(btn.dataset.vram);
                updatePerformance();
                showToast(`Rig Profile Updated: ${btn.textContent.trim()}`);
            });

            // 2. Search & Genre Filtering
            function filterAndSortGames() {
                const gameGrid = document.getElementById('gameGrid');
                const cardsArray = Array.from(gameCards);

                cardsArray.forEach(card => {
                    const title = card.dataset.title.toLowerCase();
                    const genre = card.dataset.genre.toLowerCase();
                    const matchesSearch = title.includes(searchQuery);
                    const matchesGenre = activeGenre === 'all' || genre.includes(activeGenre.toLowerCase());

                    if (matchesSearch && matchesGenre) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });

                // Sorting
                const sortVal = sortSelect.value;
                cardsArray.sort((a, b) => {
                    if (sortVal === 'name-asc') {
                        return a.dataset.title.localeCompare(b.dataset.title);
                    } else if (sortVal === 'size-asc') {
                        return parseFloat(a.dataset.size) - parseFloat(b.dataset.size);
                    } else if (sortVal === 'size-desc') {
                        return parseFloat(b.dataset.size) - parseFloat(a.dataset.size);
                    }
                });

                cardsArray.forEach(card => gameGrid.appendChild(card));
            }

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                filterAndSortGames();
            });

            genreChips.addEventListener('click', (e) => {
                const chip = e.target.closest('.chip');
                if (!chip) return;
                genreChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                activeGenre = chip.dataset.genre;
                filterAndSortGames();
            });

            sortSelect.addEventListener('change', filterAndSortGames);

            // 3. Selection & Cart Drawer System
            document.addEventListener('click', (e) => {
                // Toggle Select Game
                const btnPlay = e.target.closest('[data-action="toggle"]');
                if (btnPlay) {
                    const id = btnPlay.dataset.id;
                    const card = document.querySelector(`.game-card[data-id="${id}"]`);
                    toggleSelectGame(id, card);
                    return;
                }

                // Show System Requirements Modal
                const btnReqs = e.target.closest('[data-action="reqs"]');
                if (btnReqs) {
                    const id = btnReqs.dataset.id;
                    const card = document.querySelector(`.game-card[data-id="${id}"]`);
                    openReqsModal(card);
                    return;
                }
            });

            function toggleSelectGame(id, card) {
                if (selectedGames.has(id)) {
                    selectedGames.delete(id);
                    card.classList.remove('selected');
                    card.querySelector('.btn-play').innerHTML = '<i class="fa-solid fa-plus"></i> Select Game';
                } else {
                    selectedGames.set(id, {
                        title: card.dataset.title,
                        size: parseFloat(card.dataset.size)
                    });
                    card.classList.add('selected');
                    card.querySelector('.btn-play').innerHTML = '<i class="fa-solid fa-check"></i> Selected';
                }
                updateCartUI();
            }

            function updateCartUI() {
                cartCount.textContent = selectedGames.size;
                btnCopy.disabled = selectedGames.size === 0;

                if (selectedGames.size === 0) {
                    cartItems.innerHTML = '<li class="empty-msg">No games selected yet.</li>';
                    totalSizeEl.textContent = '0.00 GB';
                    return;
                }

                let totalSize = 0;
                cartItems.innerHTML = '';

                selectedGames.forEach((game, id) => {
                    totalSize += game.size;
                    const li = document.createElement('li');
                    li.className = 'cart-item';
                    li.innerHTML = `
                        <span class="cart-item-title"><i class="fa-solid fa-gamepad"></i> ${game.title}</span>
                        <div class="cart-item-right">
                            <span>${game.size >= 1 ? game.size.toFixed(2) + ' GB' : (game.size * 1024).toFixed(0) + ' MB'}</span>
                            <button class="btn-remove-item" data-id="${id}"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                    cartItems.appendChild(li);
                });

                totalSizeEl.textContent = totalSize >= 1 ? `${totalSize.toFixed(2)} GB` : `${(totalSize * 1024).toFixed(0)} MB`;

                // Handle remove button inside cart
                cartItems.querySelectorAll('.btn-remove-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        const card = document.querySelector(`.game-card[data-id="${id}"]`);
                        if (card) toggleSelectGame(id, card);
                    });
                });
            }

            btnClearAll.addEventListener('click', () => {
                selectedGames.clear();
                gameCards.forEach(card => {
                    card.classList.remove('selected');
                    card.querySelector('.btn-play').innerHTML = '<i class="fa-solid fa-plus"></i> Select Game';
                });
                updateCartUI();
                showToast('Selection cleared');
            });

            btnCopy.addEventListener('click', () => {
                const titles = Array.from(selectedGames.values()).map(g => `- ${g.title} (${g.size} GB)`).join('\n');
                navigator.clipboard.writeText(`Selected Games List:\n${titles}`);
                showToast('Game list copied to clipboard!');
            });

            // 4. Modal System
            function openReqsModal(card) {
                modalGameTitle.innerHTML = `<i class="fa-solid fa-microchip"></i> ${card.dataset.title}`;
                modalReqsGrid.innerHTML = `
                    <div class="req-card-row">
                        <span class="req-card-label"><i class="fa-solid fa-microchip"></i> CPU</span>
                        <span class="req-card-value">${card.dataset.cpu}</span>
                    </div>
                    <div class="req-card-row">
                        <span class="req-card-label"><i class="fa-solid fa-memory"></i> RAM</span>
                        <span class="req-card-value">${card.dataset.ram} GB</span>
                    </div>
                    <div class="req-card-row">
                        <span class="req-card-label"><i class="fa-solid fa-desktop"></i> GPU / VRAM</span>
                        <span class="req-card-value">${card.dataset.gpu} (${card.dataset.vram} GB VRAM)</span>
                    </div>
                    <div class="req-card-row">
                        <span class="req-card-label"><i class="fa-solid fa-hard-drive"></i> Size</span>
                        <span class="req-card-value">${card.dataset.size} GB</span>
                    </div>
                `;
                reqsModal.classList.add('active');
            }

            btnCloseModal.addEventListener('click', () => reqsModal.classList.remove('active'));
            reqsModal.addEventListener('click', (e) => {
                if (e.target === reqsModal) reqsModal.classList.remove('active');
            });

            // Toast Helper
            function showToast(msg) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${msg}`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            // Init
            updatePerformance();
        });
    </script>
</body>
</html>
