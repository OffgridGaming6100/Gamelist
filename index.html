<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offgrid Gaming | Instant. Offline. Play.</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #08070c;
            --bg-card: rgba(22, 18, 32, 0.85);
            --bg-card-hover: rgba(31, 26, 46, 0.95);
            --accent-orange: #ff6a00;
            --accent-purple: #9d4edd;
            --accent-purple-glow: #7b2cbf;
            --accent-purple-light: #c77dff;
            --accent-green: #00e676;
            --accent-blue: #00b4d8;
            --accent-yellow: #ffd166;
            --accent-red: #ff3366;
            --border-color: rgba(157, 78, 221, 0.25);
            --text-main: #f3effa;
            --text-muted: #9a8cae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* --- HIGH-TECH CYBERPUNK BACKGROUND SYSTEM --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 260px;
            position: relative;
            overflow-x: hidden;
        }

        /* Layer 1: Ambient Neon Spotlights */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 140vw;
            height: 140vh;
            background: 
                radial-gradient(circle at 20% 20%, rgba(157, 78, 221, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(255, 106, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(0, 180, 216, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 0%, rgba(123, 44, 191, 0.25) 0%, transparent 55%);
            z-index: -2;
            pointer-events: none;
            animation: ambientPulse 12s ease-in-out infinite alternate;
        }

        /* Layer 2: Cyber Grid Texture & Scanline Overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 40px 40px, 40px 40px, 100% 4px;
            z-index: -1;
            pointer-events: none;
            opacity: 0.85;
        }

        @keyframes ambientPulse {
            0% { opacity: 0.7; transform: translateX(-50%) scale(1); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.08); }
        }

        header {
            text-align: center;
            padding: 25px 20px 15px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(8, 7, 12, 0.95) 0%, rgba(8, 7, 12, 0.75) 100%);
            backdrop-filter: blur(12px);
        }

        .site-logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(157, 78, 221, 0.6));
        }

        .controls {
            max-width: 1100px;
            margin: 20px auto 10px;
            padding: 0 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rig-analyzer-panel {
            background: rgba(18, 14, 28, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(157, 78, 221, 0.1);
            border-radius: 12px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
        }

        .rig-title {
            font-family: 'Teko', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 1.2px;
            color: var(--accent-orange);
            text-shadow: 0 0 12px rgba(255, 106, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn-preset {
            background: rgba(11, 10, 16, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .btn-preset:hover, .btn-preset.active {
            color: #fff;
            border-color: var(--accent-orange);
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.4) 0%, rgba(255, 106, 0, 0.4) 100%);
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.4);
        }

        .filter-sort-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-purple-light);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .sort-dropdown {
            padding: 12px 16px;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .genre-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .chip:hover, .chip.active {
            background: rgba(157, 78, 221, 0.25);
            color: var(--accent-purple-light);
            border-color: var(--accent-purple);
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.3);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px 20px 20px;
            flex: 1;
            width: 100%;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-orange);
            box-shadow: 0 10px 30px rgba(255, 106, 0, 0.3);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #0b0a10;
            border-bottom: 1px solid var(--border-color);
        }

        .hud-status-badge {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 10;
            background: rgba(8, 7, 12, 0.9);
            backdrop-filter: blur(6px);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .hud-status-badge.status-ready {
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.35);
        }

        .fps-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(8, 7, 12, 0.88);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 10;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .setting-tweak-hint {
            font-size: 0.7rem;
            color: var(--accent-yellow);
            background: rgba(255, 209, 102, 0.1);
            border-left: 2px solid var(--accent-yellow);
            padding: 4px 6px;
            border-radius: 0 4px 4px 0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .btn-play {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-orange) 100%);
            color: #fff;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 6px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reqs {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .btn-reqs:hover {
            background: rgba(157, 78, 221, 0.15);
            color: var(--accent-purple-light);
            border-color: var(--accent-purple);
        }

        /* --- DRAWER WIDGET --- */
        .cart-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            max-width: calc(100vw - 40px);
            background: rgba(18, 14, 28, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid var(--accent-purple);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(157, 78, 221, 0.25);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }

        .cart-header {
            background: rgba(157, 78, 221, 0.15);
            padding: 12px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: var(--accent-purple-light);
        }

        .hdd-storage-section {
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tetris-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            border: 1px solid var(--border-color);
        }

        .cart-footer {
            padding: 12px 15px;
            background: var(--bg-dark);
            border-top: 1px solid var(--border-color);
        }

        .btn-copy-drawer {
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-orange) 100%);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Offgrid Gaming Logo" class="site-logo" onerror="this.src='https://via.placeholder.com/200x60/161220/ff6a00?text=OFFGRID+GAMING'">
    </header>

    <div class="controls">
        <div class="rig-analyzer-panel">
            <div class="rig-title">
                <i class="fa-solid fa-microchip"></i> System Rig Compatibility Profile
            </div>
            <div class="preset-buttons">
                <button class="btn-preset active">Budget Rig (8GB RAM / 4GB VRAM)</button>
                <button class="btn-preset">Mid Gaming (16GB RAM / 6GB VRAM)</button>
                <button class="btn-preset">Beast Mode (32GB RAM / 12GB VRAM)</button>
            </div>
        </div>

        <div class="filter-sort-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search games...">
            </div>
            <select class="sort-dropdown">
                <option>Sort: A to Z</option>
                <option>Sort: Size (Smallest)</option>
                <option>Sort: Size (Largest)</option>
            </select>
        </div>

        <div class="genre-chips">
            <button class="chip active">All Games</button>
            <button class="chip">RPG</button>
            <button class="chip">Open World</button>
            <button class="chip">Souls-like</button>
            <button class="chip">Racing</button>
        </div>
    </div>

    <main class="container">
        <div class="game-grid">
            <!-- Game Card 1 -->
            <div class="game-card">
                <div class="hud-status-badge status-ready"><i class="fa-solid fa-circle-check"></i> Compatible</div>
                <div class="card-img-wrapper">
                    <img src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1091500/header.jpg" alt="Cyberpunk 2077" class="card-img">
                    <div class="fps-badge"><i class="fa-solid fa-gauge-high"></i> ~60 FPS</div>
                </div>
                <div class="card-content">
                    <div class="game-title">Cyberpunk 2077</div>
                    <div class="game-meta">
                        <span>RPG</span>
                        <span>70 GB</span>
                    </div>
                    <div class="setting-tweak-hint"><i class="fa-solid fa-sliders"></i> Ultra settings ready</div>
                    <div class="card-actions">
                        <button class="btn-play"><i class="fa-solid fa-plus"></i> Select Game</button>
                        <button class="btn-reqs"><i class="fa-solid fa-sliders"></i> System Reqs</button>
                    </div>
                </div>
            </div>

            <!-- Game Card 2 -->
            <div class="game-card">
                <div class="hud-status-badge status-ready"><i class="fa-solid fa-circle-check"></i> Compatible</div>
                <div class="card-img-wrapper">
                    <img src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/271590/header.jpg" alt="GTA V" class="card-img">
                    <div class="fps-badge"><i class="fa-solid fa-gauge-high"></i> ~90 FPS</div>
                </div>
                <div class="card-content">
                    <div class="game-title">Grand Theft Auto V</div>
                    <div class="game-meta">
                        <span>Open World</span>
                        <span>100 GB</span>
                    </div>
                    <div class="setting-tweak-hint"><i class="fa-solid fa-sliders"></i> Max settings ready</div>
                    <div class="card-actions">
                        <button class="btn-play"><i class="fa-solid fa-plus"></i> Select Game</button>
                        <button class="btn-reqs"><i class="fa-solid fa-sliders"></i> System Reqs</button>
                    </div>
                </div>
            </div>

            <!-- Game Card 3 -->
            <div class="game-card">
                <div class="hud-status-badge status-ready"><i class="fa-solid fa-circle-check"></i> Compatible</div>
                <div class="card-img-wrapper">
                    <img src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1245620/header.jpg" alt="Elden Ring" class="card-img">
                    <div class="fps-badge"><i class="fa-solid fa-gauge-high"></i> ~60 FPS</div>
                </div>
                <div class="card-content">
                    <div class="game-title">Elden Ring</div>
                    <div class="game-meta">
                        <span>Souls-like</span>
                        <span>50 GB</span>
                    </div>
                    <div class="setting-tweak-hint"><i class="fa-solid fa-sliders"></i> Max settings ready</div>
                    <div class="card-actions">
                        <button class="btn-play"><i class="fa-solid fa-plus"></i> Select Game</button>
                        <button class="btn-reqs"><i class="fa-solid fa-sliders"></i> System Reqs</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="cart-widget">
        <div class="cart-header">
            <span><i class="fa-solid fa-layer-group"></i> Selected Titles</span>
        </div>
        <div class="hdd-storage-section">
            <div class="tetris-bar-bg"></div>
        </div>
        <div class="cart-footer">
            <button class="btn-copy-drawer">
                <i class="fa-solid fa-copy"></i> Copy Selection List
            </button>
        </div>
    </div>

</body>
</html>
